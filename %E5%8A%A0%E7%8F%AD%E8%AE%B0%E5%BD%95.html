<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>加班记录</title>
<style>
:root{--bg:#f2f5f7;--card:#fff;--ink:#14202b;--sub:#6b7a88;--line:#dde4ea;--sel:#0f6e8c;--selt:#fff;--noon:#d98a00;--aft:#2563c9;--pay:#0b7a4b;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1519;--card:#18222a;--ink:#e8eef2;--sub:#8fa0ad;--line:#2a3742;--sel:#3ba6c8;--selt:#08161c;--noon:#f0a92e;--aft:#6ea2f5;--pay:#4fd08e}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"PingFang SC","Noto Sans SC",sans-serif}.wrap{max-width:560px;margin:auto;padding:14px 14px 40px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.head b{font-size:19px}.nav{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--ink);font-size:18px}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.dow{text-align:center;color:var(--sub);font-size:13px;padding:4px 0}.day{position:relative;aspect-ratio:1/1.05;border-radius:10px;border:1px solid transparent;background:none;color:var(--ink);font-size:16px;padding:0}.day.sel{background:var(--sel);color:var(--selt);font-weight:600}.day.today{border-color:var(--sel)}.day .dots{position:absolute;bottom:4px;left:0;right:0;display:flex;justify-content:center;gap:3px}.dot{width:6px;height:6px;border-radius:50%}.dot.n{background:var(--noon)}.dot.a{background:var(--aft)}.day.sel .dot{outline:1.5px solid var(--selt)}.tools{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.chip,.secondary{border:1px solid var(--line);background:none;color:var(--ink);border-radius:18px;padding:7px 12px;font-size:14px}.go{width:100%;height:46px;border:0;border-radius:12px;background:var(--sel);color:var(--selt);font-size:16px;font-weight:600}.go:disabled{opacity:.4}.hint{color:var(--sub);font-size:12px;margin-top:7px}.sum{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center}.sum div{padding:8px 0}.sum small{display:block;color:var(--sub);font-size:12px}.sum b{font-size:20px}.pay{color:var(--pay)}.wage{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);margin-top:8px;padding-top:10px}.wage input{width:86px;text-align:center;border:1px solid var(--line);border-radius:8px;background:none;color:var(--ink);font-size:16px;height:36px}.item{padding:10px 0;border-top:1px solid var(--line)}.item:first-child{border-top:0}.itemtop{display:flex;justify-content:space-between;gap:8px}.d{font-weight:600}.muted{font-size:13px;color:var(--sub)}.del{border:0;background:none;color:var(--sub);font-size:13px;padding:4px}.empty{color:var(--sub);text-align:center;padding:14px 0;font-size:14px}h2{font-size:16px;margin:0 0 8px}.field label{display:block;font-size:13px;color:var(--sub);margin-bottom:4px}.time-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.time-box{border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}.time-head{display:flex;align-items:center;gap:8px;font-weight:600}.time-head input{width:18px;height:18px}.time-head .n{color:var(--noon)}.time-head .a{color:var(--aft)}input[type=time],input[type=email],input[type=number],input[type=text]{width:100%;min-width:0;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);padding:9px;font-size:16px}input[type=time]{padding:8px 5px}.auth-title{font-size:21px;font-weight:700}.auth-sub{color:var(--sub);font-size:13px;margin:4px 0 14px}.auth-msg{font-size:13px;color:var(--sub);margin-top:10px;overflow-wrap:anywhere}.error{color:#c0392b}.accountbar{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--sub);margin:0 2px 10px}.accountbar span{overflow-wrap:anywhere}.tabs{display:flex;gap:8px;margin-bottom:10px}.tabs button{flex:1}.tabs button.active{background:var(--sel);color:var(--selt);border-color:var(--sel)}.team-filter{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}.team-person{padding:10px 0;border-top:1px solid var(--line)}[hidden]{display:none!important}
</style>
</head><body><div class="wrap">
<div class="card" id="authCard"><div class="auth-title">加班记录 · 邮箱登录</div><div class="auth-sub">使用邮箱验证码登录，登录后自动同步云端记录。</div><div class="field"><label for="email">邮箱地址</label><input id="email" type="email" autocomplete="email" placeholder="name@example.com"></div><button class="go" id="sendCode" style="margin-top:10px">发送邮箱验证码</button><div id="verifyArea" hidden style="margin-top:12px"><div class="field"><label for="otp">邮箱验证码</label><input id="otp" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="输入邮件中的验证码"></div><button class="go" id="verifyCode" style="margin-top:10px">登录 / 注册</button></div><div class="auth-msg" id="authMsg">首次使用也可以直接验证邮箱注册。请先完成下方 Supabase 配置。</div></div>
<div id="mainApp" hidden><div class="accountbar"><span id="accountLabel"></span><button class="secondary" id="logout">退出登录</button></div>
<div class="tabs"><button class="chip active" id="myTab">我的加班</button><button class="chip" id="teamTab" hidden>组长管理</button></div>
<div id="myView">
<div class="card"><div class="head"><button class="nav" id="prev">‹</button><b id="title"></b><button class="nav" id="next">›</button></div><div class="grid" id="dow"></div><div class="grid" id="cal"></div><div class="tools"><button class="chip" id="wk">选本月工作日</button><button class="chip" id="all">选本月全部</button><button class="chip" id="clr">清除选择</button></div></div>
<div class="card"><h2>批量添加加班 <span id="cnt" class="muted"></span></h2><div class="time-box"><label class="time-head"><input type="checkbox" id="noonOn" checked><span class="n">中午加班</span></label><div class="time-row" style="margin-top:8px"><div class="field"><label for="noonStart">开始时间</label><input id="noonStart" type="time" step="60" value="12:00"></div><div class="field"><label for="noonEnd">结束时间</label><input id="noonEnd" type="time" step="60" value="13:00"></div></div></div><div class="time-box"><label class="time-head"><input type="checkbox" id="aftOn" checked><span class="a">下午加班</span></label><div class="time-row" style="margin-top:8px"><div class="field"><label for="aftStart">开始时间</label><input id="aftStart" type="time" step="60" value="17:30"></div><div class="field"><label for="aftEnd">结束时间</label><input id="aftEnd" type="time" step="60" value="19:30"></div></div></div><button class="go" id="apply" disabled>先在日历里点选日期</button><div class="hint">时间精确到分钟。每个时段分别按实际时长向上取整到 0.5 小时计薪；例如 1 小时 10 分钟按 1.5 小时计算。跨午夜暂不支持。应用到所选的每一天会覆盖当天原有记录。</div></div>
<div class="card"><h2 id="sumT">本月统计</h2><div class="sum"><div><small>中午计薪时长</small><b id="sN">0</b><small>小时</small></div><div><small>下午计薪时长</small><b id="sA">0</b><small>小时</small></div><div><small>加班工资</small><b class="pay" id="sP">¥0</b><small>按计薪时长</small></div></div><div class="wage"><span>加班时薪(元/小时)</span><input id="wage" type="number" min="0" step="0.5" value="40"></div><div class="muted" id="syncStatus" style="margin-top:8px">未同步</div></div>
<div class="card"><h2>加班明细</h2><div id="list"></div></div></div>
<div id="teamView" hidden><div class="card"><h2>全员加班记录</h2><div class="team-filter"><div class="field"><label for="teamMonth">月份</label><input id="teamMonth" type="month"></div><div class="field"><label for="teamPerson">员工</label><select id="teamPerson" style="width:100%;height:42px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font-size:14px"><option value="all">全部员工</option></select></div></div><div class="sum"><div><small>员工人数</small><b id="teamCount">0</b></div><div><small>计薪小时</small><b id="teamHours">0</b></div><div><small>加班工资合计</small><b id="teamPay" class="pay">¥0</b></div></div><div class="muted" id="teamStatus" style="margin-top:8px"></div><div id="teamList"></div></div></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(function(){
// 必须配置为 Supabase 项目的 Project URL 和 publishable/anon key；禁止使用 service_role/secret key。
var SUPABASE_URL='YOUR_SUPABASE_PROJECT_URL';
var SUPABASE_PUBLISHABLE_KEY='YOUR_SUPABASE_PUBLISHABLE_KEY';
var configured=SUPABASE_URL.indexOf('YOUR_')!==0&&SUPABASE_PUBLISHABLE_KEY.indexOf('YOUR_')!==0&&window.supabase;
var sb=configured?window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY):null;
var $=function(id){return document.getElementById(id)}, pad=function(n){return n<10?'0'+n:''+n}, fmt=function(n){return (Math.round(n*100)/100).toString()};
var now=new Date(),Y=now.getFullYear(),M=now.getMonth(),sel={},rec={},wage=40,user=null,role='employee',teamProfiles=[],teamRows=[],localLegacy=null,loading=false;
try{localLegacy=JSON.parse(localStorage.getItem('overtime_v1')||'null')}catch(e){}
function msg(t,err){$('authMsg').textContent=t;$('authMsg').className='auth-msg'+(err?' error':'')}
function dateKey(y,m,d){return y+'-'+pad(m+1)+'-'+pad(d)}
function setView(team){$('myView').hidden=team;$('teamView').hidden=!team;$('myTab').classList.toggle('active',!team);$('teamTab').classList.toggle('active',team)}
function minutes(start,end){if(!start||!end)return 0;var a=start.split(':').map(Number),b=end.split(':').map(Number),v=b[0]*60+b[1]-a[0]*60-a[1];return v>0?v:0}
function segment(on,start,end){if(!on)return {start:'',end:'',minutes:0,billed:0};var m=minutes(start,end);return {start:start,end:end,minutes:m,billed:m?Math.ceil(m/30)/2:0}}
function hours(r){return (r.noon?.billed||0)+(r.aft?.billed||0)}
function actual(r){return ((r.noon?.minutes||0)+(r.aft?.minutes||0))/60}
function money(r){return hours(r)*Number(r.wage||wage||40)}
function localSave(){if(!user)return;try{localStorage.setItem('overtime_v2_'+user.id,JSON.stringify({rec:rec,wage:wage}))}catch(e){}}
async function cloudSaveOne(k){if(!sb||!user||!rec[k])return;var r=rec[k];$('syncStatus').textContent='正在同步…';var {error}=await sb.from('overtime_records').upsert({user_id:user.id,work_date:k,noon_start:r.noon.start||null,noon_end:r.noon.end||null,aft_start:r.aft.start||null,aft_end:r.aft.end||null,wage:Number(r.wage||wage)}, {onConflict:'user_id,work_date'});if(error){$('syncStatus').textContent='同步失败：'+error.message;return}$('syncStatus').textContent='已同步到云端';}
async function cloudDeleteOne(k){if(!sb||!user)return;var {error}=await sb.from('overtime_records').delete().eq('user_id',user.id).eq('work_date',k);if(error)$('syncStatus').textContent='删除云端记录失败：'+error.message;else $('syncStatus').textContent='已同步到云端'}
async function loadMonth(){if(!sb||!user)return;var start=Y+'-'+pad(M+1)+'-01',end=Y+'-'+pad(M+1)+'-'+pad(new Date(Y,M+1,0).getDate());$('syncStatus').textContent='正在读取云端…';var {data,error}=await sb.from('overtime_records').select('*').eq('user_id',user.id).gte('work_date',start).lte('work_date',end);if(error){$('syncStatus').textContent='读取失败：'+error.message;return}rec={};(data||[]).forEach(function(row){rec[row.work_date]={noon:segmentFrom(row.noon_start,row.noon_end),aft:segmentFrom(row.aft_start,row.aft_end),wage:Number(row.wage||40)}});$('syncStatus').textContent='已同步到云端';render()}
function segmentFrom(s,e){var m=minutes(s||'',e||'');return {start:s||'',end:e||'',minutes:m,billed:m?Math.ceil(m/30)/2:0}}
function render(){var title=$('title');title.textContent=Y+'年'+(M+1)+'月';var first=new Date(Y,M,1).getDay(),days=new Date(Y,M+1,0).getDate(),h='';for(var i=0;i<first;i++)h+='<div></div>';for(var d=1;d<=days;d++){var k=dateKey(Y,M,d),r=rec[k],c='day'+(sel[k]?' sel':'')+(k===dateKey(now.getFullYear(),now.getMonth(),now.getDate())?' today':'');h+='<button class="'+c+'" data-k="'+k+'">'+d+(r?'<span class="dots">'+((r.noon&&r.noon.minutes)?'<i class="dot n"></i>':'')+((r.aft&&r.aft.minutes)?'<i class="dot a"></i>':'')+'</span>':'')+'</button>'}$('cal').innerHTML=h;var n=Object.keys(sel).length;$('cnt').textContent=n?'（已选 '+n+' 天）':'';$('apply').disabled=!n;$('apply').textContent=n?'保存到已选的 '+n+' 天':'先在日历里点选日期';stats()}
function stats(){var pre=Y+'-'+pad(M+1)+'-',ks=Object.keys(rec).filter(k=>k.indexOf(pre)===0).sort(),sn=0,sa=0,h='';ks.forEach(function(k){var r=rec[k],n=r.noon||segmentFrom('',''),a=r.aft||segmentFrom('','');sn+=n.billed;sa+=a.billed;var d=Number(k.slice(8)),wd='日一二三四五六'[new Date(Y,M,d).getDay()];function line(label,s){if(!s||!s.minutes)return '';return '<div class="muted">'+label+'：'+s.start+'–'+s.end+' · 实际 '+Math.floor(s.minutes/60)+'小时'+(s.minutes%60)+'分 · 计薪 '+fmt(s.billed)+'小时</div>'}h+='<div class="item"><div class="itemtop"><div><div class="d">'+(M+1)+'月'+d+'日 周'+wd+'</div>'+line('中午',n)+line('下午',a)+'</div><div style="text-align:right;white-space:nowrap"><b class="pay">¥'+fmt(money(r))+'</b><button class="del" data-del="'+k+'">删除</button></div></div></div>'});$('list').innerHTML=h||'<div class="empty">本月还没有加班记录</div>';$('sumT').textContent=(M+1)+'月统计（共 '+ks.length+' 天）';$('sN').textContent=fmt(sn);$('sA').textContent=fmt(sa);$('sP').textContent='¥'+fmt((sn+sa)*wage)}
$('dow').innerHTML=['日','一','二','三','四','五','六'].map(d=>'<div class="dow">'+d+'</div>').join('');$('wage').value=wage;$('teamMonth').value=Y+'-'+pad(M+1);
$('sendCode').onclick=async function(){if(!sb){msg('尚未配置 Supabase。请在 HTML 中填写 Project URL 和 publishable/anon key，并按配置说明执行 SQL。',true);return}var email=$('email').value.trim();if(!email||!email.includes('@')){msg('请输入有效邮箱地址。',true);return}$('sendCode').disabled=true;var {error}=await sb.auth.signInWithOtp({email:email,options:{shouldCreateUser:true}});$('sendCode').disabled=false;if(error){msg('发送失败：'+error.message,true);return}$('verifyArea').hidden=false;msg('验证码已发送到 '+email+'，请查收邮件后输入验证码。')};
$('verifyCode').onclick=async function(){if(!sb)return;var email=$('email').value.trim(),token=$('otp').value.trim();if(!token){msg('请输入邮件中的验证码。',true);return}var {data,error}=await sb.auth.verifyOtp({email:email,token:token,type:'email'});if(error){msg('验证失败：'+error.message,true);return}if(data.user)await initUser(data.user)};
async function initUser(u){if(!sb||!u)return;user=u;$('authCard').hidden=true;$('mainApp').hidden=false;$('accountLabel').textContent=u.email+' · 正在读取权限';var {data,error}=await sb.from('user_profiles').select('role,email').eq('id',u.id).maybeSingle();if(error){$('mainApp').hidden=true;$('authCard').hidden=false;msg('无法读取账号权限，请先执行 SQL 配置：'+error.message,true);return}role=data?.role||'employee';$('accountLabel').textContent=(data?.email||u.email)+' · '+(role==='manager'?'组长':'员工');$('teamTab').hidden=role!=='manager';wage=40;var local=null;try{local=JSON.parse(localStorage.getItem('overtime_v2_'+u.id)||'null')}catch(e){}if(local&&local.wage)wage=Number(local.wage);$('wage').value=wage;await loadMonth();if(role==='manager')await loadTeam();}
sb&&sb.auth.getSession().then(({data})=>{if(data.session) initUser(data.session.user)});if(sb)sb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){user=null;$('mainApp').hidden=true;$('authCard').hidden=false;msg('已退出登录。')}else if(session&&event==='SIGNED_IN'&&!user)initUser(session.user)});
$('logout').onclick=async function(){if(sb)await sb.auth.signOut();user=null;role='employee';$('mainApp').hidden=true;$('authCard').hidden=false;msg('已退出登录。')};$('myTab').onclick=()=>setView(false);$('teamTab').onclick=()=>{setView(true);loadTeam()};
$('cal').addEventListener('click',function(e){var b=e.target.closest('.day');if(!b)return;var k=b.getAttribute('data-k');if(sel[k])delete sel[k];else sel[k]=1;render()});$('prev').onclick=async()=>{M--;if(M<0){M=11;Y--}sel={};$('teamMonth').value=Y+'-'+pad(M+1);if(user)await loadMonth();else render()};$('next').onclick=async()=>{M++;if(M>11){M=0;Y++}sel={};$('teamMonth').value=Y+'-'+pad(M+1);if(user)await loadMonth();else render()};$('clr').onclick=()=>{sel={};render()};function pick(workdays){for(var d=1;d<=new Date(Y,M+1,0).getDate();d++){var w=new Date(Y,M,d).getDay();if(!workdays||(w>0&&w<6))sel[dateKey(Y,M,d)]=1}render()}$('wk').onclick=()=>pick(true);$('all').onclick=()=>pick(false);
$('apply').onclick=async function(){if(!user){msg('请先登录。',true);return}var n=segment($('noonOn').checked,$('noonStart').value,$('noonEnd').value),a=segment($('aftOn').checked,$('aftStart').value,$('aftEnd').value);if($('noonOn').checked&&n.minutes===0){alert('请检查中午加班的开始和结束时间，结束时间必须晚于开始时间。');return}if($('aftOn').checked&&a.minutes===0){alert('请检查下午加班的开始和结束时间，结束时间必须晚于开始时间。');return}if(!n.minutes&&!a.minutes){alert('请至少勾选一个加班时段。');return}var keys=Object.keys(sel);keys.forEach(k=>rec[k]={noon:n,aft:a,wage:wage});sel={};localSave();render();$('syncStatus').textContent='正在同步…';for(const k of keys)await cloudSaveOne(k);render()};
$('list').addEventListener('click',async function(e){var k=e.target.getAttribute('data-del');if(!k)return;delete rec[k];localSave();render();await cloudDeleteOne(k)});$('wage').addEventListener('change',async function(){var v=Number($('wage').value);wage=Number.isFinite(v)&&v>=0?v:40;$('wage').value=wage;Object.keys(rec).forEach(k=>rec[k].wage=wage);localSave();stats();if(sb&&user){for(const k of Object.keys(rec))await cloudSaveOne(k)}});
async function loadTeam(){if(!sb||role!=='manager'||!user)return;$('teamStatus').textContent='正在读取全员记录…';var month=$('teamMonth').value||Y+'-'+pad(M+1),start=month+'-01',parts=month.split('-'),end=month+'-'+pad(new Date(Number(parts[0]),Number(parts[1]),0).getDate());var [pr,rr]=await Promise.all([sb.from('user_profiles').select('id,email,role').order('email'),sb.from('overtime_records').select('*').gte('work_date',start).lte('work_date',end).order('work_date')]);if(pr.error||rr.error){$('teamStatus').textContent='读取失败：'+(pr.error||rr.error).message;return}teamProfiles=pr.data||[];teamRows=rr.data||[];var users={};teamProfiles.forEach(p=>users[p.id]=p);$('teamPerson').innerHTML='<option value="all">全部员工</option>'+teamProfiles.map(p=>'<option value="'+p.id+'">'+escapeHtml(p.email||p.id)+'</option>').join('');renderTeam()}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderTeam(){var pick=$('teamPerson').value||'all',rows=teamRows.filter(r=>pick==='all'||r.user_id===pick),profiles={};teamProfiles.forEach(p=>profiles[p.id]=p);var hoursTotal=0,payTotal=0,people={};rows.forEach(r=>{var n=segmentFrom(r.noon_start,r.noon_end),a=segmentFrom(r.aft_start,r.aft_end),h=n.billed+a.billed;hoursTotal+=h;payTotal+=h*Number(r.wage||40);people[r.user_id]=1});$('teamCount').textContent=Object.keys(people).length;$('teamHours').textContent=fmt(hoursTotal);$('teamPay').textContent='¥'+fmt(payTotal);$('teamStatus').textContent='共 '+rows.length+' 条记录；时间段分别按 0.5 小时向上取整计薪。';$('teamList').innerHTML=rows.map(r=>{var n=segmentFrom(r.noon_start,r.noon_end),a=segmentFrom(r.aft_start,r.aft_end),h=n.billed+a.billed;return '<div class="team-person"><div class="itemtop"><div><b>'+escapeHtml(profiles[r.user_id]?.email||r.user_id)+'</b><div class="muted">'+r.work_date+'</div><div class="muted">'+(n.minutes?'中午 '+n.start+'–'+n.end+'（实际 '+fmt(n.minutes/60)+'h，计薪 '+fmt(n.billed)+'h）':'')+'</div><div class="muted">'+(a.minutes?'下午 '+a.start+'–'+a.end+'（实际 '+fmt(a.minutes/60)+'h，计薪 '+fmt(a.billed)+'h）':'')+'</div></div><b class="pay">¥'+fmt(h*Number(r.wage||40))+'</b></div></div>'}).join('')||'<div class="empty">该筛选条件下暂无记录</div>'}
$('teamMonth').addEventListener('change',loadTeam);$('teamPerson').addEventListener('change',renderTeam);
