<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>加班记录</title>
<style>
:root{--bg:#f2f5f7;--card:#fff;--ink:#14202b;--sub:#6b7a88;--line:#dde4ea;--sel:#0f6e8c;--selt:#fff;--noon:#d98a00;--aft:#2563c9;--pay:#0b7a4b;--err:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#0f1519;--card:#18222a;--ink:#e8eef2;--sub:#8fa0ad;--line:#2a3742;--sel:#3ba6c8;--selt:#08161c;--noon:#f0a92e;--aft:#6ea2f5;--pay:#4fd08e;--err:#ff7b6b}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:480px;margin:0 auto;padding:14px 14px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 8px}
.hide{display:none!important}
input,button{font:inherit;color:var(--ink)}
.in{width:100%;height:46px;border:1px solid var(--line);border-radius:10px;background:none;padding:0 12px;margin-bottom:10px}
.go{width:100%;height:48px;border:0;border-radius:12px;background:var(--sel);color:var(--selt);font-weight:600}
.go:disabled{opacity:.4}
.link{border:0;background:none;color:var(--sel);padding:8px 0}
.msg{color:var(--sub);font-size:13px;margin-top:6px}.msg.e{color:var(--err)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:14px;color:var(--sub)}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;height:40px;border:1px solid var(--line);border-radius:10px;background:none}
.tab.on{background:var(--sel);color:var(--selt);border-color:var(--sel)}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.head b{font-size:19px}
.nav{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:none;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;color:var(--sub);font-size:13px}
.day{position:relative;aspect-ratio:1/1.05;border-radius:10px;border:1px solid transparent;background:none;padding:0}
.day.sel{background:var(--sel);color:var(--selt);font-weight:600}
.day.today{border-color:var(--sel)}
.dots{position:absolute;bottom:4px;left:0;right:0;display:flex;justify-content:center;gap:3px}
.dot{width:6px;height:6px;border-radius:50%}.dot.noon{background:var(--noon)}.dot.afternoon{background:var(--aft)}
.day.sel .dot{outline:1.5px solid var(--selt)}
.chips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:none;border-radius:18px;padding:6px 12px;font-size:14px}
.seg{display:flex;gap:8px;margin-bottom:10px}
.seg button{flex:1;height:42px;border:1px solid var(--line);border-radius:10px;background:none}
.seg button.on{border-color:var(--sel);box-shadow:inset 0 0 0 1px var(--sel);font-weight:600}
.row{display:flex;gap:10px}.row>div{flex:1}
label.l{display:block;font-size:13px;color:var(--sub);margin-bottom:4px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.sum small{display:block;color:var(--sub);font-size:12px}.sum b{font-size:21px}
.pay{color:var(--pay)}
.item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.item:first-child{border-top:0}
.item .t{color:var(--sub);font-size:13px}
.del{border:0;background:none;color:var(--sub);font-size:13px}
.empty{color:var(--sub);text-align:center;padding:12px 0;font-size:14px}
details{border-top:1px solid var(--line);padding:10px 0}
details:first-of-type{border-top:0}
summary{display:flex;justify-content:space-between;gap:8px;cursor:pointer;list-style:none}
summary span.t{color:var(--sub);font-size:13px}
.sub{padding:6px 0 0 4px;font-size:14px;color:var(--sub)}
.dot-i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
</style>
</head>
<body>
<div class="wrap">

<div id="cfg" class="card hide"><h2>还没配置云端服务</h2><div class="msg">请先打开本文件，把顶部 CFG 里的 url 和 key 换成你自己的 Supabase 项目信息。</div></div>

<div id="login" class="card hide">
  <h2>邮箱登录</h2>
  <div id="s1">
    <input class="in" id="email" type="email" inputmode="email" autocomplete="email" placeholder="输入你的邮箱">
    <button class="go" id="send">发送验证码</button>
  </div>
  <div id="s2" class="hide">
    <div class="msg" style="margin:0 0 8px">验证码已发送到 <span id="sentTo"></span></div>
    <input class="in" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="输入邮件里的验证码">
    <button class="go" id="verify">登录</button>
    <button class="link" id="back">换个邮箱</button>
  </div>
  <div class="msg" id="lmsg"></div>
</div>

<div id="app" class="hide">
  <div class="top"><span id="who"></span><span><button class="link" id="rename">改名</button> <button class="link" id="out">退出</button></span></div>
  <div class="tabs"><button class="tab on" id="tMine">我的加班</button><button class="tab hide" id="tTeam">团队汇总</button></div>

  <div class="card">
    <div class="head"><button class="nav" id="prev">‹</button><b id="title"></b><button class="nav" id="next">›</button></div>
    <div id="calBox">
      <div class="grid" id="dow"></div><div class="grid" id="cal"></div>
      <div class="chips"><button class="chip" id="wk">选本月工作日</button><button class="chip" id="all">选本月全部</button><button class="chip" id="clr">清除选择</button></div>
    </div>
  </div>

  <div id="mine">
    <div class="card">
      <h2>给所选日期添加加班 <span id="cnt" class="t" style="color:var(--sub);font-weight:400;font-size:14px"></span></h2>
      <div class="seg"><button id="pN" class="on">中午</button><button id="pA">下午</button></div>
      <div class="row">
        <div><label class="l">开始时间</label><input class="in" id="st" type="time" value="12:00" step="60"></div>
        <div><label class="l">结束时间</label><input class="in" id="et" type="time" value="13:00" step="60"></div>
      </div>
      <div class="msg" id="calc" style="margin:-4px 0 10px"></div>
      <button class="go" id="apply" disabled>先在日历里点选日期</button>
      <div class="msg">同一时段已有记录的日期会被覆盖。计时规则：按半小时为单位，不足 30 分钟的零头不计。</div>
      <div class="msg e" id="amsg"></div>
    </div>
    <div class="card">
      <h2 id="sumT">本月统计</h2>
      <div class="sum"><div><small>中午合计</small><b id="sN">0</b><small>小时</small></div><div><small>下午合计</small><b id="sA">0</b><small>小时</small></div><div><small>加班工资</small><b class="pay" id="sP">¥0</b><small id="wg"></small></div></div>
    </div>
    <div class="card"><h2>加班明细</h2><div id="list"></div></div>
  </div>

  <div id="team" class="hide">
    <div class="card"><h2 id="teamT">全员汇总</h2><div id="tlist"></div></div>
  </div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script>
// ===== 只需要改这里：Supabase 项目设置 -> API 里复制 =====
const CFG = { url: 'https://hszkcinfhmfftmsgiwpl.supabase.co', key: 'sb_publishable_zzxXQiLGMt5Sio0Uf5CcPQ_QSl-hd49' };
// 计时：不足半小时的零头 向下舍去；想改成进位，把 Math.floor 换成 Math.ceil
const billed = m => Math.floor(m / 30) * 0.5;
// ======================================================
const $ = id => document.getElementById(id), pad = n => String(n).padStart(2, '0');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => String(Math.round(n * 100) / 100), PN = { noon: '中午', afternoon: '下午' };
const key = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
const hm = t => t.slice(0, 5), toMin = t => { const [a, b] = t.split(':'); return +a * 60 + +b; };
const now = new Date(), todayK = key(now.getFullYear(), now.getMonth(), now.getDate());
let sb, me = null, recs = [], profs = [], sel = {}, Y = now.getFullYear(), M = now.getMonth(), tab = 'mine', period = 'noon', email = '';
const show = (id, on) => $(id).classList.toggle('hide', !on);

if (CFG.url.includes('YOUR-PROJECT')) { show('cfg', true); }
else {
  sb = supabase.createClient(CFG.url, CFG.key);
  sb.auth.getSession().then(({ data }) => data.session ? boot(data.session.user) : showLogin());
  sb.auth.onAuthStateChange((ev, s) => {
    if (ev === 'SIGNED_OUT') { me = null; showLogin(); }
    else if (ev === 'SIGNED_IN' && s && (!me || me.id !== s.user.id)) boot(s.user);
  });
}

function showLogin() { show('login', true); show('app', false); show('s1', true); show('s2', false); }
const lmsg = (t, e) => { $('lmsg').textContent = t; $('lmsg').className = 'msg' + (e ? ' e' : ''); };

$('send').onclick = async () => {
  email = $('email').value.trim();
  if (!/^\S+@\S+\.\S+$/.test(email)) return lmsg('请输入正确的邮箱', 1);
  $('send').disabled = true; lmsg('发送中…');
  const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: true } });
  $('send').disabled = false;
  if (error) return lmsg('发送失败：' + error.message, 1);
  $('sentTo').textContent = email; show('s1', false); show('s2', true); lmsg('');
};
$('back').onclick = () => { show('s2', false); show('s1', true); lmsg(''); };
$('verify').onclick = async () => {
  const token = $('code').value.trim(); if (!token) return lmsg('请输入验证码', 1);
  $('verify').disabled = true; lmsg('验证中…');
  const { error } = await sb.auth.verifyOtp({ email, token, type: 'email' });
  $('verify').disabled = false;
  if (error) lmsg('验证码不对或已过期：' + error.message, 1);
};
$('out').onclick = () => sb.auth.signOut();
$('rename').onclick = async () => {
  const n = prompt('显示名字（组长能看到）', me.name || ''); if (!n || !n.trim()) return;
  const { error } = await sb.from('profiles').update({ name: n.trim() }).eq('id', me.id);
  if (error) return alert('修改失败：' + error.message);
  me.name = n.trim(); $('who').textContent = me.name + (me.role === 'leader' ? '（组长）' : ''); if (tab === 'team') load();
};

async function boot(user) {
  const { data, error } = await sb.from('profiles').select('*').eq('id', user.id).single();
  if (error) { showLogin(); return lmsg('读取账号失败：' + error.message + '（请确认已运行 setup.sql）', 1); }
  me = data; show('login', false); show('app', true);
  $('who').textContent = (me.name || me.email) + (me.role === 'leader' ? '（组长）' : '');
  show('tTeam', me.role === 'leader'); $('wg').textContent = me.hourly_wage + ' 元/小时';
  setTab('mine');
}
function setTab(t) {
  tab = t; sel = {}; $('tMine').classList.toggle('on', t === 'mine'); $('tTeam').classList.toggle('on', t === 'team');
  show('mine', t === 'mine'); show('team', t === 'team'); show('calBox', t === 'mine'); load();
}
$('tMine').onclick = () => setTab('mine'); $('tTeam').onclick = () => setTab('team');

async function load() {
  const a = key(Y, M, 1), b = key(Y, M, new Date(Y, M + 1, 0).getDate());
  let q = sb.from('overtime_records').select('*').gte('work_date', a).lte('work_date', b).order('work_date').order('start_time');
  if (tab === 'mine') q = q.eq('user_id', me.id);
  const r = await q; if (r.error) return alert('读取失败：' + r.error.message);
  recs = r.data;
  if (tab === 'team') { const p = await sb.from('profiles').select('*').order('name'); profs = p.data || []; }
  render();
}

$('dow').innerHTML = '日一二三四五六'.split('').map(d => `<div class="dow">${d}</div>`).join('');
function render() {
  $('title').textContent = `${Y}年${M + 1}月`;
  tab === 'mine' ? renderMine() : renderTeam();
}
function renderMine() {
  const first = new Date(Y, M, 1).getDay(), days = new Date(Y, M + 1, 0).getDate(); let h = '';
  for (let i = 0; i < first; i++) h += '<div></div>';
  for (let d = 1; d <= days; d++) {
    const k = key(Y, M, d), rs = recs.filter(r => r.work_date === k), ps = [...new Set(rs.map(r => r.period))];
    h += `<button class="day${sel[k] ? ' sel' : ''}${k === todayK ? ' today' : ''}" data-k="${k}">${d}` +
      (ps.length ? `<span class="dots">${ps.map(p => `<i class="dot ${p}"></i>`).join('')}</span>` : '') + '</button>';
  }
  $('cal').innerHTML = h;
  const n = Object.keys(sel).length;
  $('cnt').textContent = n ? `(已选 ${n} 天)` : ''; $('apply').disabled = !n;
  $('apply').textContent = n ? `添加到已选的 ${n} 天` : '先在日历里点选日期';
  let sn = 0, sa = 0;
  recs.forEach(r => { r.period === 'noon' ? sn += billed(r.minutes) : sa += billed(r.minutes); });
  $('sN').textContent = fmt(sn); $('sA').textContent = fmt(sa); $('sP').textContent = '¥' + fmt((sn + sa) * me.hourly_wage);
  $('sumT').textContent = `${M + 1}月统计（共 ${new Set(recs.map(r => r.work_date)).size} 天）`;
  let l = '', last = '';
  recs.forEach(r => {
    const d = +r.work_date.slice(8), wd = '日一二三四五六'[new Date(Y, M, d).getDay()];
    l += `<div class="item"><div><div>${M + 1}月${d}日 周${wd}　<span class="dot-i" style="background:var(--${r.period === 'noon' ? 'noon' : 'aft'})"></span>${PN[r.period]}</div>` +
      `<div class="t">${hm(r.start_time)}–${hm(r.end_time)}，共 ${r.minutes} 分钟，计 ${fmt(billed(r.minutes))} 小时</div></div>` +
      `<div style="text-align:right"><b class="pay">¥${fmt(billed(r.minutes) * me.hourly_wage)}</b><br><button class="del" data-del="${r.id}">删除</button></div></div>`;
  });
  $('list').innerHTML = l || '<div class="empty">本月还没有加班记录</div>';
}
function renderTeam() {
  let h = '', tot = 0, tp = 0;
  profs.forEach(p => {
    const rs = recs.filter(r => r.user_id === p.id); if (!rs.length) return;
    let n = 0, a = 0; rs.forEach(r => r.period === 'noon' ? n += billed(r.minutes) : a += billed(r.minutes));
    const pay = (n + a) * p.hourly_wage; tot += n + a; tp += pay;
    h += `<details><summary><b>${esc(p.name || p.email)}</b><span class="t">中午 ${fmt(n)}h　下午 ${fmt(a)}h　<b class="pay">¥${fmt(pay)}</b></span></summary><div class="sub">` +
      rs.map(r => `${+r.work_date.slice(5, 7)}月${+r.work_date.slice(8)}日 ${PN[r.period]} ${hm(r.start_time)}–${hm(r.end_time)}（${r.minutes}分钟，计${fmt(billed(r.minutes))}h）`).join('<br>') + '</div></details>';
  });
  $('tlist').innerHTML = (h || '<div class="empty">本月还没有人登记加班</div>') +
    `<div class="item"><b>合计</b><span><b>${fmt(tot)}</b> 小时　<b class="pay">¥${fmt(tp)}</b></span></div>`;
  $('teamT').textContent = `${M + 1}月全员汇总`;
}

$('cal').onclick = e => { const b = e.target.closest('.day'); if (!b) return; const k = b.dataset.k; sel[k] ? delete sel[k] : sel[k] = 1; renderMine(); };
$('prev').onclick = () => { M--; if (M < 0) { M = 11; Y--; } sel = {}; load(); };
$('next').onclick = () => { M++; if (M > 11) { M = 0; Y++; } sel = {}; load(); };
$('clr').onclick = () => { sel = {}; renderMine(); };
const pick = wk => { const n = new Date(Y, M + 1, 0).getDate(); for (let d = 1; d <= n; d++) { const w = new Date(Y, M, d).getDay(); if (!wk || (w > 0 && w < 6)) sel[key(Y, M, d)] = 1; } renderMine(); };
$('wk').onclick = () => pick(true); $('all').onclick = () => pick(false);

function setPeriod(p) {
  period = p; $('pN').classList.toggle('on', p === 'noon'); $('pA').classList.toggle('on', p === 'afternoon');
  $('st').value = p === 'noon' ? '12:00' : '17:30'; $('et').value = p === 'noon' ? '13:00' : '19:00'; calc();
}
function calc() {
  const s = $('st').value, e = $('et').value; if (!s || !e) { $('calc').textContent = ''; return null; }
  const m = toMin(e) - toMin(s);
  if (m <= 0) { $('calc').textContent = '结束时间要晚于开始时间'; return null; }
  $('calc').textContent = `时长 ${m} 分钟，计 ${fmt(billed(m))} 小时` + (billed(m) === 0 ? '（不足 30 分钟，不计时）' : '');
  return m;
}
$('pN').onclick = () => setPeriod('noon'); $('pA').onclick = () => setPeriod('afternoon');
$('st').oninput = calc; $('et').oninput = calc; calc();

$('apply').onclick = async () => {
  const m = calc(), dates = Object.keys(sel); $('amsg').textContent = '';
  if (!m) return $('amsg').textContent = '请填写正确的开始和结束时间';
  $('apply').disabled = true;
  let r = await sb.from('overtime_records').delete().eq('user_id', me.id).eq('period', period).in('work_date', dates);
  if (!r.error) r = await sb.from('overtime_records').insert(dates.map(d => ({ user_id: me.id, work_date: d, period, start_time: $('st').value, end_time: $('et').value, minutes: m })));
  if (r.error) { $('amsg').textContent = '保存失败：' + r.error.message; $('apply').disabled = false; return; }
  sel = {}; load();
};
$('list').onclick = async e => {
  const id = e.target.dataset.del; if (!id || !confirm('删除这条记录？')) return;
  const { error } = await sb.from('overtime_records').delete().eq('id', id);
  if (error) return alert('删除失败：' + error.message); load();
};
</script>
</body>
</html>
