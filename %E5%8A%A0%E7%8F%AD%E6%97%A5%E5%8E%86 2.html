<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>加班日历</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#202124;--muted:#747985;--line:#e8eaf0;--green:#2f9e65;--greenbg:#e5f7ec;--orange:#f29d49;--shadow:0 5px 22px rgba(25,35,55,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}button{font:inherit;cursor:pointer;border:0} .app{max-width:720px;margin:auto;padding:18px 15px 38px}
.top{display:flex;align-items:center;justify-content:space-between;margin:8px 0 20px}.top h1{font-size:25px;margin:0}.sub{font-size:13px;color:var(--muted);margin-top:5px}.rate{background:#fff;border:1px solid var(--line);border-radius:15px;padding:10px 13px;font-weight:700;color:var(--green)}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:17px}.stat{background:var(--card);padding:16px;border-radius:18px;box-shadow:var(--shadow)}.stat small{display:block;color:var(--muted);font-size:12px;margin-bottom:9px}.stat strong{font-size:25px;letter-spacing:-.5px}.stat em{font-size:12px;font-style:normal;color:var(--muted);margin-left:3px}
.panel{background:var(--card);border-radius:20px;padding:17px;box-shadow:var(--shadow);margin-bottom:15px}.monthbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.monthbar h2{font-size:19px;margin:0}.nav{width:36px;height:36px;border-radius:12px;background:#f1f3f6;font-size:20px}.week,.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.week div{text-align:center;color:var(--muted);font-size:11px;padding:5px 0 9px}.day{min-height:58px;border-radius:12px;background:#f7f8fa;padding:7px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--text);border:1px solid transparent}.day .num{font-size:13px}.day .dot{height:5px;width:5px;border-radius:50%;background:transparent}.day.has .dot{background:var(--green)}.day.selected{border-color:var(--green);background:var(--greenbg)}.day.today .num{font-weight:800}.day.muted{opacity:.3}.day .tiny{font-size:9px;color:var(--green);font-weight:700;min-height:10px}
.selectedline{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.selectedline h3{font-size:18px;margin:0}.pill{font-size:12px;border-radius:99px;padding:6px 10px;background:#f0f2f5;color:var(--muted)}
.shift{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.shift:last-of-type{border-bottom:0}.check{width:24px;height:24px;border:1.5px solid #c7cbd3;border-radius:8px;display:grid;place-items:center;flex-shrink:0;background:#fff;color:#fff}.shift.active .check{background:var(--green);border-color:var(--green)}.shift.active .check:after{content:"✓";font-size:15px;font-weight:800}.shiftinfo{flex:1}.shiftinfo strong{display:block;font-size:15px}.shiftinfo span{display:block;font-size:12px;color:var(--muted);margin-top:4px}.hours{display:flex;align-items:center;gap:7px}.hours input{width:52px;text-align:center;padding:8px 3px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:#fff}.hours span{font-size:12px;color:var(--muted)}
.dailyresult{background:#f7f9f8;border-radius:15px;padding:14px;margin-top:13px}.resultrow{display:flex;justify-content:space-between;gap:12px;margin:6px 0;font-size:13px}.resultrow span{color:var(--muted)}.resultrow strong{font-size:13px}.resultrow.total{border-top:1px solid #e2e8e4;padding-top:12px;margin-top:12px}.resultrow.total strong{font-size:20px;color:var(--green)}.actions{display:flex;gap:9px;margin-top:13px}.btn{flex:1;padding:12px;border-radius:12px;background:#f0f2f5;color:var(--text);font-weight:650;font-size:13px}.btn.primary{background:var(--green);color:#fff}.monthtitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.monthtitle h3{font-size:16px;margin:0}.monthtitle span{font-size:12px;color:var(--muted)}.record{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px}.record:last-child{border-bottom:0}.record small{display:block;color:var(--muted);margin-top:4px}.record strong{color:var(--green)}.empty{text-align:center;color:var(--muted);padding:20px 0;font-size:13px}.foot{text-align:center;color:#969ba5;font-size:11px;padding:3px 0 20px}
@media(min-width:600px){.day{min-height:67px}.app{padding-top:28px}.stat strong{font-size:29px}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div><h1>加班日历 🗓️</h1><div class="sub">每天勾选时段，自动统计工时与工资</div></div><div class="rate">¥40 / 小时</div></div>
  <div class="summary">
    <div class="stat"><small>本月加班时长</small><strong id="monthHours">0</strong><em>小时</em></div>
    <div class="stat"><small>本月加班工资</small><strong id="monthPay">¥0</strong></div>
  </div>
  <section class="panel">
    <div class="monthbar"><button class="nav" id="prev" aria-label="上个月">‹</button><h2 id="monthLabel"></h2><button class="nav" id="next" aria-label="下个月">›</button></div>
    <div class="week"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div>
    <div class="calendar" id="calendar"></div>
  </section>
  <section class="panel">
    <div class="selectedline"><h3 id="selectedLabel">选择日期</h3><span class="pill" id="selectedBadge">未加班</span></div>
    <div class="shift" id="lunchRow"><button class="check" id="lunchCheck" aria-label="勾选中午加班"></button><div class="shiftinfo"><strong>中午加班</strong><span>午间时段</span></div><div class="hours"><input id="lunchHours" type="number" min="0" max="12" step="0.5" value="1" aria-label="中午加班小时数"><span>小时</span></div></div>
    <div class="shift" id="afternoonRow"><button class="check" id="afternoonCheck" aria-label="勾选下午加班"></button><div class="shiftinfo"><strong>下午加班</strong><span>下午 / 晚间时段</span></div><div class="hours"><input id="afternoonHours" type="number" min="0" max="12" step="0.5" value="3" aria-label="下午加班小时数"><span>小时</span></div></div>
    <div class="dailyresult">
      <div class="resultrow"><span id="lunchSummary">中午加班</span><strong id="lunchTotal">0 小时</strong></div>
      <div class="resultrow"><span id="afternoonSummary">下午加班</span><strong id="afternoonTotal">0 小时</strong></div>
      <div class="resultrow total"><span>当天合计 · ¥40/小时</span><strong id="dayPay">¥0</strong></div>
      <div class="resultrow"><span>当天总工时</span><strong id="dayHours">0 小时</strong></div>
    </div>
    <div class="actions"><button class="btn" id="clearDay">清除当天</button><button class="btn primary" id="saveDay">保存当天记录</button></div>
  </section>
  <section class="panel">
    <div class="monthtitle"><h3>本月记录</h3><span id="recordCount">0 天有加班</span></div>
    <div id="records"><div class="empty">选择日期并勾选加班时段，记录会显示在这里</div></div>
  </section>
  <div class="foot">记录保存在此浏览器中 · 加班工资按 ¥40/小时计算</div>
</div>
<script>
(function(){
 const RATE=40, now=new Date(); let viewY=now.getFullYear(), viewM=now.getMonth(), selected=new Date(now.getFullYear(),now.getMonth(),now.getDate());
 let data={}; let lunchOn=false, afternoonOn=false;
 const $=id=>document.getElementById(id);
 const key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
 const money=n=>'¥'+(Math.round(n*100)/100).toLocaleString('zh-CN',{maximumFractionDigits:2});
 const hours=n=>`${Number(n.toFixed(2))} 小时`;
 const readInputs=()=>({lunch: lunchOn?Math.max(0,Number($('lunchHours').value)||0):0, afternoon:afternoonOn?Math.max(0,Number($('afternoonHours').value)||0):0, lunchOn,afternoonOn});
 function totals(v){let h=(v.lunchOn?v.lunch:0)+(v.afternoonOn?v.afternoon:0);return {h,p:h*RATE};}
 function loadSelected(){let v=data[key(selected)]||{lunchOn:false,afternoonOn:false,lunch:1,afternoon:3};lunchOn=!!v.lunchOn;afternoonOn=!!v.afternoonOn;$('lunchHours').value=v.lunch??1;$('afternoonHours').value=v.afternoon??3;syncEditor();}
 function syncEditor(){
  $('lunchCheck').parentElement.classList.toggle('active',lunchOn);$('afternoonCheck').parentElement.classList.toggle('active',afternoonOn);
  const v=readInputs(),t=totals(v);
  $('selectedLabel').textContent=`${selected.getMonth()+1}月${selected.getDate()}日 · ${['周日','周一','周二','周三','周四','周五','周六'][selected.getDay()]}`;
  $('selectedBadge').textContent=t.h>0?'已加班':'未加班';
  $('lunchSummary').textContent=lunchOn?`中午加班 × ${v.lunch} 小时`:'中午加班（未勾选）';$('afternoonSummary').textContent=afternoonOn?`下午加班 × ${v.afternoon} 小时`:'下午加班（未勾选）';
  $('lunchTotal').textContent=hours(lunchOn?v.lunch:0);$('afternoonTotal').textContent=hours(afternoonOn?v.afternoon:0);
  $('dayPay').textContent=money(t.p);$('dayHours').textContent=hours(t.h);
 }
 function save(){let v=readInputs();if(v.lunchOn||v.afternoonOn){data[key(selected)]={...v};}else delete data[key(selected)];renderCalendar();renderStats();renderRecords();syncEditor();}
 function renderCalendar(){
  $('monthLabel').textContent=`${viewY}年${viewM+1}月`;let el=$('calendar');el.innerHTML='';
  const first=new Date(viewY,viewM,1).getDay(),days=new Date(viewY,viewM+1,0).getDate(),prevDays=new Date(viewY,viewM,0).getDate();
  for(let i=0;i<42;i++){let dayNum,dt,muted=false;if(i<first){dayNum=prevDays-first+i+1;dt=new Date(viewY,viewM-1,dayNum);muted=true;}else if(i>=first+days){dayNum=i-first-days+1;dt=new Date(viewY,viewM+1,dayNum);muted=true;}else{dayNum=i-first+1;dt=new Date(viewY,viewM,dayNum);}
   if(i>=first+days && i>=35)break;
   const k=key(dt),v=data[k],t=v?totals(v):{h:0};let b=document.createElement('button');b.className='day'+(muted?' muted':'')+(key(selected)===k?' selected':'')+(key(now)===k?' today':'')+(t.h?' has':'');
   b.innerHTML=`<span class="num">${dayNum}</span><span class="dot"></span><span class="tiny">${t.h?`${t.h}h`:''}</span>`;
   b.onclick=()=>{selected=dt;viewY=dt.getFullYear();viewM=dt.getMonth();loadSelected();renderCalendar();};el.appendChild(b);
  }
 }
 function renderStats(){let h=0,p=0;for(const [k,v] of Object.entries(data)){if(k.startsWith(`${viewY}-${String(viewM+1).padStart(2,'0')}-`)){let t=totals(v);h+=t.h;p+=t.p;}}$('monthHours').textContent=Number(h.toFixed(2));$('monthPay').textContent=money(p);}
 function renderRecords(){let entries=Object.entries(data).filter(([k])=>k.startsWith(`${viewY}-${String(viewM+1).padStart(2,'0')}-`)).sort((a,b)=>a[0].localeCompare(b[0]));$('recordCount').textContent=`${entries.length} 天有加班`;let el=$('records');if(!entries.length){el.innerHTML='<div class="empty">本月还没有加班记录</div>';return;}el.innerHTML='';entries.forEach(([k,v])=>{let t=totals(v),parts=[];if(v.lunchOn)parts.push(`中午 ${v.lunch}h`);if(v.afternoonOn)parts.push(`下午 ${v.afternoon}h`);let d=document.createElement('div');d.className='record';d.innerHTML=`<div>${Number(k.slice(-2))}日<small>${parts.join(' · ')}</small></div><div style="text-align:right"><strong>${money(t.p)}</strong><small>${t.h} 小时</small></div>`;d.onclick=()=>{selected=new Date(k+'T12:00:00');loadSelected();renderCalendar();};d.style.cursor='pointer';el.appendChild(d);});}
 $('lunchCheck').onclick=()=>{lunchOn=!lunchOn;syncEditor();};$('afternoonCheck').onclick=()=>{afternoonOn=!afternoonOn;syncEditor();};
 $('lunchHours').oninput=syncEditor;$('afternoonHours').oninput=syncEditor;
 $('saveDay').onclick=save;$('clearDay').onclick=()=>{lunchOn=false;afternoonOn=false;save();};
 $('prev').onclick=()=>{viewM--;if(viewM<0){viewM=11;viewY--;}renderCalendar();renderStats();renderRecords();};
 $('next').onclick=()=>{viewM++;if(viewM>11){viewM=0;viewY++;}renderCalendar();renderStats();renderRecords();};
 try{data=JSON.parse(localStorage.getItem('overtime-calendar-v1')||'{}');}catch(e){data={};}
 const originalSave=save; save=function(){originalSave();try{localStorage.setItem('overtime-calendar-v1',JSON.stringify(data));}catch(e){}};
 // Also persist whenever a date is explicitly cleared/saved; data is stored locally in this browser.
 loadSelected();renderCalendar();renderStats();renderRecords();
})();
</script>
</body>
</html>
